<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/image.jpg">
    <title>Products Dashboard</title>

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <p class="compatibility-notice" role="note">
        Compatibility notice: SellBot doesn't work on Brave or iOS devices yet.
    </p>

    <!-- NAVIGATION BAR -->
    <nav class="nav-bar" aria-label="Main navigation">
        <div class="nav-brand">SellBot</div>
        <div class="nav-links">
            <a href="product.html" class="nav-link active">Products</a>
            <a href="profile.html" class="nav-link">Profile</a>
        </div>
    </nav>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div>
            <h1>Products</h1>
            <p>Manage your products with ease.</p>
        </div>

        <button id="openModalBtn" class="primary-btn">
            + New Product
        </button>

    </header>


    <!-- ================= SEARCH ================= -->

    <section class="toolbar">

        <input type="text" placeholder="Search products..." class="search-input">

    </section>


    <!-- ================= PRODUCTS ================= -->

    <main>

        <div class="product-grid" id="productGrid" aria-busy="true"></div>
        <p class="list-status" id="listStatusText" aria-live="polite"></p>

    </main>



    <!-- ================= MODAL ================= -->

    <div class="modal hidden" id="productModal">

        <div class="modal-card">

            <div class="modal-header">

                <h2>Create Product</h2>

                <button class="close-btn" id="closeModalBtn">
                    ×
                </button>

            </div>


            <form class="product-form">

                <div class="input-group">

                    <label>
                        Product Name
                    </label>

                    <input type="text" placeholder="Wireless Mouse" required>

                </div>


                <div class="input-group">

                    <label>
                        Price
                    </label>

                    <input type="number" step="0.01" placeholder="29.99" required>

                </div>


                <div class="input-group">

                    <label>
                        Description
                    </label>

                    <textarea rows="4" placeholder="Describe your product..."></textarea>

                </div>

                <p class="form-status" id="productStatusText" aria-live="polite"></p>

                <button type="submit" class="primary-btn full-width">
                    Create Product
                </button>

            </form>

        </div>

    </div>

    <div class="modal hidden" id="analyticsModal">

        <div class="modal-card analytics-modal-card">

            <div class="modal-header">

                <h2>Chat Session Count</h2>

                <button class="close-btn" id="closeAnalyticsModalBtn">
                    ×
                </button>

            </div>

            <p id="analyticsModalProductId" class="analytics-product-id-text"></p>
            <pre id="analyticsModalContent" class="analytics-content" aria-live="polite"></pre>

        </div>

    </div>

    <!-- Application Script -->
    <script type="module" src="js/app.js"></script>

</body>

</html>
