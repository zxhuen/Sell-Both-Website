<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/image.jpg">
</head>

<body>

    <p class="compatibility-notice" role="note">
        Compatibility notice: SellBot doesn't work on Brave or iOS devices yet.
    </p>

    <!-- ===========================
         Header Navigation & Product Overview
    ============================ -->
    <header class="header">
        <a href="index.html" class="back-link">
            ← Back to Products
        </a>

        <!-- Product Summary Section -->
        <div class="product-hero-card" id="productHero" aria-busy="true">
            <div class="product-hero-header">
                <div>
                    <span class="product-badge">Product Overview</span>
                    <h1 id="productTitle" class="product-hero-title"><span class="skeleton skeleton-title" aria-hidden="true"></span></h1>
                </div>
                <div class="price-tag" id="productPrice"><span class="skeleton skeleton-price" aria-hidden="true"></span></div>
            </div>


        </div>
    </header>

    <!-- ===========================
         Interactive Chat Section
    ============================ -->
    <main>
        <section class="chat-section">
            <div class="chat-header">
                <div class="chat-status">
                    <span class="status-indicator"></span>
                    <div>
                        <h3>Product Assistant</h3>
                        <p>Ask anything about features, setup, or warranty</p>
                    </div>
                </div>
            </div>

            <!-- Scrollable Message Stream -->
            <div class="chat-messages" id="chatMessages" aria-busy="true">
                <div class="message assistant-message">
                    <div class="message-avatar skeleton" aria-hidden="true"></div>
                    <div class="message-content skeleton skeleton-chat" aria-hidden="true"></div>
                </div>
            </div>

            <!-- Input Controls -->
            <form class="chat-input-area" id="chatForm" onsubmit="event.preventDefault();">
                <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="send-btn" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </section>
    </main>

    <script type="module" src="js/product.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>

</html>
